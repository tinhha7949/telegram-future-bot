# Multi-timeframe market-structure strategy with structure-only entries.
QUOTE_ASSET: "USDT"
MAX_SYMBOLS: 100
MIN_24H_QUOTE_VOLUME_USDT: 5000000
MIN_24H_RANGE_PCT: 2.0
TREND_TIMEFRAME: "4h"
TREND_HISTORY_CANDLES: 250
CONFIRMATION_TIMEFRAME: "1h"
CONFIRMATION_HISTORY_CANDLES: 300
STRUCTURE_LOOKBACK_CANDLES: 250
MAJOR_PIVOT_LEFT_BARS: 3
MAJOR_PIVOT_RIGHT_BARS: 3
CONFIRMATION_PIVOT_LEFT_BARS: 2
CONFIRMATION_PIVOT_RIGHT_BARS: 2
ENTRY_RETEST_TOLERANCE_ATR: 0.25
BOS_TOLERANCE_ATR: 0.25
MIN_SCORE_TO_ENTER: 70
ENTRY_RETEST_MAX_PENETRATION_ATR: 0.25
ENTRY_MAX_EXTENSION_ATR: 1.5
ENTRY_RETEST_MAX_BARS: 8
ENTRY_CONTINUATION_MAX_BARS: 4
ENTRY_ATR_PERIOD: 14
ENTRY_TIMEFRAME: "15m"
ENTRY_STRUCTURE_LOOKBACK_CANDLES: 100
PIVOT_LEFT_BARS: 2
PIVOT_RIGHT_BARS: 2
SL_ATR_PERIOD: 14
SL_PIVOT_MAX_DISTANCE: 30
SL_PIVOT_BUFFER_ATR: 0.35
SL_PIVOT_BUFFER_MIN_PCT: 0.10
SL_MIN_R_MULTIPLE: 0.7
SL_MAX_R_MULTIPLE: 1.5
SL_FALLBACK_ATR_MULTIPLIER: 1.5
SL_FALLBACK_MIN_PCT: 0.25
SL_FALLBACK_MAX_PCT: 2.0
REWARD_RISK: 1.5
TP1_REWARD_RISK: 1.2
TP2_REWARD_RISK: 1.5
TP1_CLOSE_PERCENT: 60
TP2_CLOSE_PERCENT: 40
BE_TRIGGER_TP1_PROGRESS_PCT: 70
MAX_ABS_FUNDING_RATE: 0.0005
MAX_SPREAD_BPS: 10
MAX_HOLD_HOURS: 24
COIN_COOLDOWN_MINUTES: 0
MAX_OPEN_POSITIONS: 10
MAX_TRADES_PER_DAY: 300
# Each new trade targets this percentage of total Futures wallet balance as isolated position margin.
# Example: 0.10 = 10%; wallet 10 USDT -> target margin 1 USDT per new trade.
POSITION_MARGIN_PCT: 0.10
# Legacy sizing settings retained for config compatibility; they do not control order quantity.
RISK_PER_TRADE_PCT: 0.1
MAX_POSITION_BALANCE_PCT: 0.25
LEVERAGE: 20
SCAN_INTERVAL_MS: 15000
SYMBOL_REFRESH_MS: 900000
BINANCE_RECV_WINDOW_MS: 5000
BINANCE_HTTP_TIMEOUT_MS: 10000
MONGO_DB_NAME: "trades"
MONGO_TRADES_COLLECTION: "simple_trades"
MONGO_STATE_COLLECTION: "simple_bot_state"
DRY_RUN: false
