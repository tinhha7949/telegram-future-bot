# Single-timeframe RSI divergence + liquidity sweep strategy.
QUOTE_ASSET: "USDT"
MIN_24H_QUOTE_VOLUME_USDT: 5000000
MIN_24H_RANGE_PCT: 2.0
# Maximum number of eligible symbols to scan, ranked by 24h quote volume.
MAX_SYMBOLS: 100
STRATEGY_TIMEFRAME: "15m"
HISTORY_CANDLES: 300
RSI_PERIOD: 14
PIVOT_LEFT_BARS: 2
PIVOT_RIGHT_BARS: 2
MIN_PIVOT_DISTANCE: 5
MAX_PIVOT_DISTANCE: 40
SWEEP_MAX_WAIT_BARS: 20
SWEEP_MIN_ATR: 0.05
CONFIRMATION_MAX_BARS: 3
ATR_PERIOD: 14
# Stop Loss only: sweep extreme +/- max(ATR * SL_ATR_BUFFER, entry * SL_MIN_BUFFER_PERCENT / 100).
SL_ATR_BUFFER: 0.20
SL_MIN_BUFFER_PERCENT: 0.10
MAX_SL_ATR: 3.0
# Take Profit settings below are unchanged and continue to control the existing Binance TP1/TP2 system.
REWARD_RISK: 1.5
TP1_REWARD_RISK: 1.2
TP2_REWARD_RISK: 1.5
TP1_CLOSE_PERCENT: 70
TP2_CLOSE_PERCENT: 30
BE_TRIGGER_TP1_PROGRESS_PCT: 60
MAX_ABS_FUNDING_RATE: 0.0005
MAX_SPREAD_BPS: 10
MAX_HOLD_HOURS: 24
COIN_COOLDOWN_MINUTES: 0
MAX_OPEN_POSITIONS: 10
MAX_TRADES_PER_DAY: 300
# Each new trade targets this percentage of total Futures wallet balance as position margin.
POSITION_MARGIN_PCT: 0.10
# Legacy sizing settings retained for config compatibility; they do not control order quantity.
RISK_PER_TRADE_PCT: 0.1
MAX_POSITION_BALANCE_PCT: 0.25
LEVERAGE: 20
SCAN_INTERVAL_MS: 15000
SYMBOL_REFRESH_MS: 900000
BINANCE_RECV_WINDOW_MS: 5000
BINANCE_HTTP_TIMEOUT_MS: 10000
MONGO_DB_NAME: "trades"
MONGO_TRADES_COLLECTION: "simple_trades"
MONGO_STATE_COLLECTION: "simple_bot_state"
DRY_RUN: false
