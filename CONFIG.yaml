# Canonical trading strategy settings. Do not override risk/strategy via .env.
N_CANDLES: 250
TIMEFRAME: "4h"
EQUITY_START: 1000.0
RISK_PER_TRADE: 0.1
MAX_DAILY_RISK: 0.25
MAX_DRAWDOWN_CIRCUIT: 0.15
MIN_RR: 0.8
MIN_EDGE: 0.08
TP_BATCHES: [3, 2]
TIMEOUT_BARS: 24
COLD_START_SAMPLES: 50
WAIT_MIN_RATIO: 0.35
MEMORY_LIMIT_MB: 500
FEE_TAKER: 0.0006
SLIPPAGE_BPS: 3

# Explicit resolutions of underspecified/conflicting strategy requirements.
# AI-7 stays in fallback until 100 completed, direction-matched labels.
AI7_ACTIVATION_SAMPLES: 100
AI7_ATR_MULTIPLIER: 1.5
FALLBACK_TP2_R: 1.6
EDGE_GAP: 0.05
CONF_HIGH: 0.7
CONF_LOW: 0.5
LOW_CONF_PENALTY: 0.15
STALE_PENALTY: 0.25
VOL_20D_RETURNS: 120
VOL_LONG_RETURNS: 240
# Live 4h analysis and the DB OHLCV archive share N_CANDLES as the single source of truth.
ATR_BARS: 14
FUNDING_HOT_RATE: 0.0008
HIGH_VOL_PERCENTILE: 0.8

WAIT_WINDOW_DAYS: 30
WAIT_EDGE_INCREMENT: 0.05
WAIT_EDGE_MAX: 1.0
MIN_TP2_R: 1.6
SHADOW_DAYS: 14
TRAIN_WINDOW_CANDLES: 3000
DAILY_TRAIN_LOOKBACK_DAYS: 180
TRAIN_MAX_OPPORTUNITIES: 50000
RISK_RESERVATION_MIN_MARGIN_MULTIPLIER: 1.0

# Mongo retention and candle persistence (strategy constants; environment is for secrets only).
RETENTION_TRIGGER_RATIO: 0.86
RETENTION_TARGET_RATIO: 0.60
RETENTION_BATCH_SIZE: 100
RETENTION_MAX_DELETES_PER_RUN: 500
RETENTION_INTERVAL_HOURS: 6
RETENTION_RAW_DAYS: 7
RETENTION_FEATURE_DAYS: 30
RETENTION_HISTORY_DAYS: 90
RETENTION_LABEL_DAYS: 365

# Closed-bar regime, feature windows and fill-cost model (same defaults as v6).
BAR_HOURS: 4
VOL_ANNUALIZATION_DAYS: 365
MOMENTUM_SHORT_RETURNS: 30
REGIME_CONF_BASE: 0.45
REGIME_CONF_MOMENTUM_WEIGHT: 0.35
REGIME_CONF_VOL_WEIGHT: 0.2
REGIME_CONF_MOMENTUM_SCALE: 0.04
REGIME_CONF_VOL_MIDPOINT: 0.5
STRUCTURE_SWING_RADIUS: 1
STRUCTURE_LOOKBACK_BARS: 120
STRUCTURE_FALLBACK_BARS: 30
VOLUME_LOOKBACK_BARS: 20
BREAKOUT_RANGE_BARS: 20
VWAP_LOOKBACK_BARS: 24
BREAKOUT_MIN_VOLUME_RATIO: 1.0
BREAKOUT_MAX_EXTENSION_RANGES: 1.0
FILL_BASE_IMPACT_PCT: 0.04
FILL_DEPTH_REFERENCE_USDT: 100000
FILL_DEPTH_FLOOR: 0.1
FILL_LATENCY_BASE_MS: 100
FILL_LATENCY_IMPACT_PCT_PER_MS: 0.00002
FILL_OI_IMPACT_COEFF: 0.02
FILL_MAX_SLIPPAGE_PCT: 2.0

# Service and market-data polling. Time units are explicit.
SCAN_INTERVAL_MS: 120000
SCAN_BATCH_SIZE: 5
SCAN_PROGRESS_EVERY_SYMBOLS: 50
PROTECTION_INTERVAL_MS: 10000
BOOKKEEPING_INTERVAL_MS: 10000
NOTIFICATION_INTERVAL_MS: 2000
CLOCK_SYNC_INTERVAL_MS: 60000
LEARNING_INTERVAL_HOURS: 24
COMMAND_POLL_INTERVAL_MS: 2000
COMMAND_LONG_POLL_SECONDS: 20
COMMAND_HTTP_TIMEOUT_MS: 25000
COMMAND_HTTP_ATTEMPTS: 2
COMMAND_HTTP_RETRY_MS: 1000
MARKET_OI_CACHE_MS: 60000
MARKET_DEPTH_CACHE_MS: 500
MARKET_DEPTH_LEVELS: 20
MARKET_OI_HISTORY_POINTS: 2
MAIN_IDLE_SLEEP_MS: 1000
TELEGRAM_HTTP_TIMEOUT_MS: 10000

# Calibration uses R-units, sufficient samples and meaningful tolerance.
CALIBRATION_MIN_SAMPLES: 20
CALIBRATION_MAX_MAE_R: 0.5
CALIBRATION_MAX_ABS_BIAS_R: 0.25

# Outcome quantiles, historical feature-score calibration and sampling.
MAE_PERCENTILE: 0.8
MFE_TP1_PERCENTILE: 0.5
MFE_TP2_PERCENTILE: 0.9
INITIAL_CONTINUATION_MOMENTUM_WEIGHT: 3.0
INITIAL_OI_LOG_LOWER_MAGNITUDE: 0.999

# Model worker, split and risk-audit sampling (unchanged operational defaults).
TRAIN_SPLIT_RATIO: 0.6
VALIDATION_SPLIT_RATIO: 0.8
TRACK_RECORD_CACHE_MS: 300000
RECENT_LABELS_LIMIT: 5000
OFFLINE_WORKER_MAX_OLD_GEN_MB: 256
OFFLINE_TRAIN_TIMEOUT_MS: 60000
RETENTION_CLEANUP_GUARD_ITERATIONS: 100
MONGO_CONNECT_TIMEOUT_MS: 10000
MONGO_SERVER_SELECTION_TIMEOUT_MS: 10000
MONGO_SOCKET_TIMEOUT_MS: 120000
MONGO_MAX_POOL_SIZE: 20
MONGO_CONNECT_RETRY_BASE_MS: 2000
MONGO_CONNECT_RETRY_MAX_MS: 60000
MONGO_CONNECT_RETRY_EXPONENT_CAP: 5
TELEGRAM_MAX_MESSAGE_CHARS: 4000
PID_LOCK_ATTEMPTS: 3
PID_HASH_HEX_CHARS: 16

# UTC session metrics and bounded report queries.
SESSION_REPORT_WINDOW_HOURS: 24
SESSION_REPORT_MAX_TRADES: 5000
SESSION_REPORT_MAX_WAIT_RECORDS: 50000

# Candidate champion objective in net R/trade, penalizing unstable drawdown.
TRAIN_DRAWDOWN_WEIGHT_PER_R: 0.05
TRAIN_MAX_DRAWDOWN_INCREASE_R: 0.1

# Feed freshness, reconnects and bounded Binance historical pagination.
LIQUIDATION_WINDOW_MINUTES: 15
LIQUIDATION_MAX_EVENTS_PER_SYMBOL: 2000
LIQUIDATION_STALE_MINUTES: 10
LIQUIDATION_RECONNECT_MS: 3000
LIQUIDATION_HEARTBEAT_INTERVAL_MS: 30000
HISTORY_MAX_INCREMENTAL_CANDLES: 1500
HISTORY_PAGE_CANDLES: 499
HISTORY_INCOMPLETE_CACHE_MS: 30000

# Operational tuning. All values are validated at boot; incompatible or unsafe settings abort startup.
# Exchange REST: retry only idempotent GETs. Signed order POSTs are never auto-retried.
BINANCE_HTTP_TIMEOUT_MS: 15000
BINANCE_HTTP_GET_ATTEMPTS: 2
BINANCE_RECV_WINDOW_MS: 10000
BINANCE_HTTP_RETRY_MS: 250
BINANCE_HTTP_5XX_RETRY_MS: 1000
BINANCE_FUNDING_INTERVAL_FALLBACK_HOURS: 8
BINANCE_CANDLE_REQUEST_LIMIT: 1500
BINANCE_REQUEST_WEIGHT_LIMIT: 1800
BINANCE_REQUEST_BACKOFF_CAP_MS: 1000
BINANCE_BACKGROUND_BUDGET_RATIO: 0.8
BINANCE_SERVER_WEIGHT_SAFETY_RATIO: 0.75
BINANCE_OI_REQUESTS_PER_5MIN: 800
BINANCE_HTTP_429_FALLBACK_MS: 60000
BINANCE_HTTP_418_FALLBACK_MS: 120000
BINANCE_METADATA_CACHE_MS: 3600000
BINANCE_AMBIGUOUS_ORDER_LOOKUP_ATTEMPTS: 5
BINANCE_AMBIGUOUS_ORDER_LOOKUP_DELAY_MS: 500
BINANCE_ACCOUNTING_PAGE_SIZE: 1000
BINANCE_FILL_HISTORY_MAX_PAGES: 100
BINANCE_FUNDING_HISTORY_MAX_PAGES: 100
TRADE_ENTRY_LOOKUP_ATTEMPTS: 5
TRADE_ENTRY_LOOKUP_DELAY_MS: 500
ENTRY_REJECTED_RETRY_INTERVAL_MS: 60000

# Market WebSocket freshness and reconnect policy.
MARKET_WS_HEARTBEAT_MS: 30000
MARKET_WS_STALE_MS: 90000
MARKET_WS_MAX_EVENT_AGE_MS: 15000
MARKET_WS_RECONNECT_BASE_MS: 1000
MARKET_WS_RECONNECT_MAX_MS: 30000
MARKET_WS_RECONNECT_EXPONENT_CAP: 5

# Telegram outbox delivery, expiry and bounded retry policy.
TELEGRAM_DELIVERY_TIMEOUT_MS: 10000
TELEGRAM_DELIVERY_IDLE_COOLDOWN_MS: 1100
TELEGRAM_DELIVERY_RETRY_BASE_MS: 2000
TELEGRAM_DELIVERY_RETRY_MAX_MS: 300000
TELEGRAM_DELIVERY_MISSING_ROUTE_MS: 60000
TELEGRAM_DELIVERY_BAD_AUTH_RETRY_MS: 3600000
TELEGRAM_DELIVERY_RETRY_EXPONENT_CAP: 8
TELEGRAM_SENT_RETENTION_DAYS: 30
TELEGRAM_ALERT_DEDUP_WINDOW_MS: 3600000

# Decision journal cache and idempotent Mongo write retry settings.
JOURNAL_MAX_RECORDS: 5000
JOURNAL_LOAD_BATCH_SIZE: 200
JOURNAL_MARKET_WINDOW_BARS: 48
JOURNAL_MIN_SAMPLES: 20
JOURNAL_MAX_LIVE_BONUS: 3
JOURNAL_FALLBACK_ROUND_TRIP_COST_RATE: 0.0008
JOURNAL_WRITE_MAX_ATTEMPTS: 3
JOURNAL_WRITE_RETRY_BACKOFF_MS: 200

# Durable closed signal claim retention and cleanup mode.
TRADE_CLOSED_CLAIMS_RETENTION_DAYS: 90
# Emergency environment overrides DB_RETENTION_ENABLE_DELETE=false and
# DB_RETENTION_DRY_RUN=true can only make cleanup more conservative.
RETENTION_ENABLE_DELETE: true
RETENTION_DRY_RUN: false
