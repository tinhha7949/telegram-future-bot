# Multi-timeframe trend, pullback, and regular-divergence strategy.
QUOTE_ASSET: "USDT"
MAX_SYMBOLS: 100
MIN_24H_QUOTE_VOLUME_USDT: 5000000
MIN_24H_RANGE_PCT: 2.0
TREND_TIMEFRAME: "1h"
TREND_EMA_PERIOD: 20
STRUCTURE_LOOKBACK_CANDLES: 80
ENTRY_TIMEFRAME: "5m"
DIVERGENCE_TIMEFRAME: "15m"
RSI_PERIOD: 14
ENTRY_RSI_LONG_MIN: 25
ENTRY_RSI_LONG_MAX: 30
ENTRY_RSI_SHORT_MIN: 70
ENTRY_RSI_SHORT_MAX: 75
DIVERGENCE_LOOKBACK_CANDLES: 100
DIVERGENCE_MAX_PIVOT_DISTANCE: 30
PIVOT_LEFT_BARS: 2
PIVOT_RIGHT_BARS: 2
ATR_PERIOD: 14
SWING_STOP_BUFFER_PCT: 0.15
SL_ATR_MULTIPLIER: 1.5
SL_MIN_PCT: 0.2
SL_MAX_PCT: 2.0
REWARD_RISK: 1.5
TP1_REWARD_RISK: 1.2
TP2_REWARD_RISK: 1.5
TP1_REWARD_RISK_NO_DIVERGENCE: 1.5
TP2_REWARD_RISK_NO_DIVERGENCE: 1.8
TP1_CLOSE_PERCENT: 70
TP2_CLOSE_PERCENT: 30
BE_TRIGGER_TP1_PROGRESS_PCT: 70
MAX_ABS_FUNDING_RATE: 0.0005
MAX_SPREAD_BPS: 10
MAX_HOLD_HOURS: 24
MAX_OPEN_POSITIONS: 10
MAX_TRADES_PER_DAY: 300
RISK_PER_TRADE_PCT: 0.05
MAX_POSITION_BALANCE_PCT: 0.25
LEVERAGE: 20
SCAN_INTERVAL_MS: 15000
SYMBOL_REFRESH_MS: 900000
BINANCE_RECV_WINDOW_MS: 5000
BINANCE_HTTP_TIMEOUT_MS: 10000
MONGO_DB_NAME: "trades"
MONGO_TRADES_COLLECTION: "simple_trades"
MONGO_STATE_COLLECTION: "simple_bot_state"
DRY_RUN: false
