# All strategy and risk settings for the simple EMA + RSI strategy.
QUOTE_ASSET: "USDT"
MAX_SYMBOLS: 100
MIN_24H_QUOTE_VOLUME_USDT: 5000000
MIN_24H_RANGE_PCT: 2.0
TREND_TIMEFRAME: "1h"
TREND_EMA_PERIOD: 5
ENTRY_TIMEFRAME: "1m"
RSI_PERIOD: 14
RSI_LONG_MIN: 10
RSI_LONG_TRIGGER: 20
RSI_SHORT_TRIGGER: 80
RSI_SHORT_MAX: 90
ATR_PERIOD: 14
SL_ATR_MULTIPLIER: 1.2
SL_MIN_PCT: 0.2
SL_MAX_PCT: 2.0
REWARD_RISK: 1.55
TP1_REWARD_RISK: 1.3
TP2_REWARD_RISK: 1.55
TP1_CLOSE_PERCENT: 70
TP2_CLOSE_PERCENT: 30
MAX_HOLD_HOURS: 24
MAX_OPEN_POSITIONS: 10
MAX_TRADES_PER_DAY: 300
RISK_PER_TRADE_PCT: 0.05
MAX_POSITION_BALANCE_PCT: 0.35
LEVERAGE: 20
SCAN_INTERVAL_MS: 15000
SYMBOL_REFRESH_MS: 900000
BINANCE_RECV_WINDOW_MS: 5000
BINANCE_HTTP_TIMEOUT_MS: 10000
MONGO_DB_NAME: "trades"
MONGO_TRADES_COLLECTION: "simple_trades"
MONGO_STATE_COLLECTION: "simple_bot_state"
DRY_RUN: false
