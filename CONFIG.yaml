# All strategy and risk settings for the simple EMA100 + RSI14 strategy.
QUOTE_ASSET: "USDT"
MAX_SYMBOLS: 100
MIN_5M_QUOTE_VOLUME_USDT: 100000
MIN_24H_QUOTE_VOLUME_USDT: 1000000
MIN_24H_RANGE_PCT: 2.0
TREND_TIMEFRAME: "4h"
TREND_EMA_PERIOD: 100
ENTRY_TIMEFRAME: "1m"
RSI_PERIOD: 14
RSI_LONG_MAX: 25
RSI_SHORT_MIN: 75
ATR_PERIOD: 14
SL_ATR_MULTIPLIER: 1.5
SL_MIN_PCT: 0.2
SL_MAX_PCT: 2.0
REWARD_RISK: 1.3
MAX_HOLD_HOURS: 24
MAX_OPEN_POSITIONS: 5
MAX_TRADES_PER_DAY: 10
RISK_PER_TRADE_PCT: 0.01
MAX_POSITION_BALANCE_PCT: 0.10
LEVERAGE: 2
SCAN_INTERVAL_MS: 15000
SYMBOL_REFRESH_MS: 900000
POSITION_SYNC_INTERVAL_MS: 10000
BINANCE_RECV_WINDOW_MS: 5000
BINANCE_HTTP_TIMEOUT_MS: 10000
MONGO_DB_NAME: "trading"
MONGO_TRADES_COLLECTION: "simple_trades"
MONGO_STATE_COLLECTION: "simple_bot_state"
DRY_RUN: false
