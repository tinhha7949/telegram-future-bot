name: Nine-AI canonical checks

on:
  push:
    branches: ["main", "feature/nine-ai-primary-strategy", "rebuild/nine-ai-spec", "fix/npm-test-suite"]
  pull_request:
    branches: ["main"]

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm test
