name: Nine-AI canonical checks

on:
  push:
    branches: ["main", "feature/nine-ai-primary-strategy", "rebuild/nine-ai-spec"]
  pull_request:
    branches: ["main"]

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check index.js
      - run: node --check ai-trading/nine-ai-pipeline.js
      - run: node ai-trading/nine-ai-pipeline.test.js
      - run: node --check ai-trading/nine-ai-central-decision-engine.js
      - run: node ai-trading/nine-ai-central-decision-engine.test.js
      - run: node --check ai-trading/nine-ai-offline-learning.js
      - run: node ai-trading/nine-ai-offline-learning.test.js
      - run: node --check ai-trading/nine-ai-decision-journal.js
      - run: node ai-trading/nine-ai-decision-journal.test.js
      - run: node --check ai-trading/execution-risk.js
      - run: node ai-trading/execution-risk.test.js
      - run: node --check ai-trading/nine-ai-db-retention.js
      - run: node ai-trading/nine-ai-db-retention.test.js
