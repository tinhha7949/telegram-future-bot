name: FenixAI bootstrap and NINE-AI handoff checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fenix-bootstrap-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check ai-trading/nine-ai-fenix-bootstrap.js
          node --check ai-trading/nine-ai-entry-strategy.js
          node --check ai-trading/nine-ai-data-derived-consensus.js
          node --check ai-trading/nine-ai-strategy.js
      - name: Test FenixAI bootstrap signal fusion
        run: node ai-trading/nine-ai-fenix-bootstrap.test.js
      - name: Test one-way entry strategy handoff
        run: node ai-trading/nine-ai-entry-strategy.test.js
      - name: Test persistent native policy activation
        run: node ai-trading/nine-ai-data-derived-consensus.test.js
      - name: Test NINE-AI strategy integration
        run: node ai-trading/nine-ai-strategy.test.js
