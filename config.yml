app:
  logLevel: info
  loopIntervalMs: 12000
  startupReconcile: true

binance:
  baseUrl: https://fapi.binance.com
  testnetBaseUrl: https://testnet.binancefuture.com
  recvWindow: 10000
  requestTimeoutMs: 12000
  maxRetries: 3
  leverage: 20
  autoAdjustLeverageToBinanceLimit: true
  marginType: ISOLATED
  workingType: MARK_PRICE

scanner:
  intervalMinutes: 15
  maxCoins: 100
  batchSize: 10
  batchDelayMs: 1000
  errorRetrySeconds: 60
  quoteAsset: USDT
  minQuoteVolume: 5000000
  minAbsPriceChangePct: 1.0
  excludeSymbols: [USDCUSDT, FDUSDUSDT, BUSDUSDT, TUSDUSDT, USDPUSDT, DAIUSDT]

strategy:
  timeframe: 5m
  rsiEnabled: true
  confirmationEnabled: false
  signalCheckIntervalSeconds: 10
  confirmationCandles: 1
  rsiPeriod: 14
  rsiShortMin: 68
  rsiShortMax: 80
  rsiLongMin: 20
  rsiLongMax: 32
  emaBias:
    enabled: true
    timeframe: 4h
    fastPeriod: 20
    slowPeriod: 50
    historyCandles: 200
  adx:
    enabled: false
    timeframe: 4h
    period: 14
    historyCandles: 100
    rangeMax: 20
    mixedMax: 26
    requireWeakCandleWhenDisabled: false
  historyCandles: 160
  atrPeriod: 14
  fallbackAtrMultiple: 1.5
  slBufferPct: 0.12
  minStopDistancePct: 0.10
  maxStopDistancePct: 5.0
  rewardRiskTp1: 2.0
  rewardRiskTp2: 3.5
  tp1ClosePct: 60
  breakevenOffsetPct: 1.0

risk:
  walletPercentPerTrade: 5
  maxActivePositions: 20
  maxMarginPerTradeUsdt: 0
  minMarginPerTradeUsdt: 0

execution:
  orderPollIntervalMs: 15000
  priceProtect: false

storage:
  databaseName: trades
  collections:
    positions: futures_positions
    setups: futures_setups
    events: futures_events
    scanner: futures_scanner
  eventRetentionDays: 90

telegram:
  sendStartupMessage: true
